<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Talent Cortex — Flight Deck</title>
<style>
  :root{
    --bg:#0b0f1a; --panel:#131a2b; --panel2:#1a2336; --line:#243049;
    --txt:#e7ecf5; --mut:#8da0c0; --accent:#5b8cff; --accent2:#22d3a6;
    --warn:#f5a623; --bad:#ff5d6c; --good:#22d3a6; --chip:#26334d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent)}
  header{display:flex;align-items:center;gap:16px;padding:16px 24px;background:linear-gradient(90deg,#0f1626,#121b30);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#06101f}
  header h1{font-size:18px;margin:0;letter-spacing:.3px}
  header .sub{color:var(--mut);font-size:12px}
  .live{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--good);animation:p 1.6s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(34,211,166,.5)}70%{box-shadow:0 0 0 9px rgba(34,211,166,0)}100%{box-shadow:0 0 0 0 rgba(34,211,166,0)}}
  nav{display:flex;gap:4px;padding:10px 24px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:71px;z-index:4}
  nav button{background:transparent;border:1px solid transparent;color:var(--mut);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
  nav button:hover{color:var(--txt);background:var(--panel2)}
  nav button.active{color:#fff;background:var(--accent);border-color:var(--accent)}
  main{padding:24px;max-width:1280px;margin:0 auto}
  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .cards{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .kpi .v{font-size:30px;font-weight:800;margin:2px 0}
  .kpi .l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
  .kpi .d{font-size:12px;color:var(--accent2);margin-top:4px}
  h2.sec{font-size:15px;margin:26px 0 12px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  tr:hover td{background:var(--panel2)}
  .chip{display:inline-block;padding:3px 9px;border-radius:20px;background:var(--chip);font-size:11px;margin:1px 3px 1px 0}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:capitalize}
  .pill.done,.pill.passed,.pill.selected,.pill.completed,.pill.legitimate,.pill.open,.pill.proceed{background:rgba(34,211,166,.16);color:var(--good)}
  .pill.running,.pill.interviewing,.pill.scheduled,.pill.scheduling,.pill.online{background:rgba(91,140,255,.18);color:var(--accent)}
  .pill.queued,.pill.pending,.pill-mut,.pill.hold{background:rgba(141,160,192,.16);color:var(--mut)}
  .pill.rejected,.pill.failed{background:rgba(255,93,108,.16);color:var(--bad)}
  .pill.filled,.pill.onhold,.pill-person{background:rgba(245,166,35,.16);color:var(--warn)}
  .muted{color:var(--mut)}
  .team-card{cursor:pointer;transition:.15s;border:1px solid var(--line)}
  .team-card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .team-card h3{margin:0 0 4px;font-size:16px}
  .team-meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--mut);font-size:12px}
  .led{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
  .led.done{background:var(--good)} .led.running{background:var(--accent);animation:p 1.6s infinite} .led.queued{background:var(--mut)}
  .member{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .member .nm{font-weight:700;min-width:200px}
  .member .tk{color:var(--mut);font-size:12px;margin-left:auto;white-space:nowrap}
  .flow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .flow .stage{flex:1;min-width:140px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
  .flow .stage .n{font-size:26px;font-weight:800}
  .flow .arrow{color:var(--mut);font-size:20px}
  .formula{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0a1020;border:1px solid var(--line);border-radius:10px;padding:12px;color:#b9c7e6;font-size:12px;white-space:pre-wrap}
  .banner{background:linear-gradient(90deg,rgba(91,140,255,.15),rgba(34,211,166,.1));border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:13px;color:var(--mut);margin-bottom:18px}
  .back{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 12px;cursor:pointer;margin-bottom:14px;font-weight:600}
  .hub{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
  .doclist .docitem{padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px}
  .doclist .docitem:hover{background:var(--panel2)}
  .doclist .docitem.active{background:var(--accent);color:#fff}
  .doclist .cat{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin:14px 0 4px}
  .md{line-height:1.65}
  .md h1{font-size:22px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .md h2{font-size:18px;margin-top:22px} .md h3{font-size:15px;color:var(--accent2)}
  .md code{background:#0a1020;padding:2px 6px;border-radius:5px;font-size:12px}
  .md pre{background:#0a1020;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto}
  .md pre code{background:none;padding:0}
  .md table{margin:10px 0}
  .md blockquote{border-left:3px solid var(--accent);margin:0;padding-left:12px;color:var(--mut)}
  @media(max-width:820px){.hub{grid-template-columns:1fr}.member .nm{min-width:auto}}
</style>
</head>
<body>
<header>
  <div class="logo">TC</div>
  <div>
    <h1>Talent Cortex <span class="sub">· Flight Deck</span></h1>
    <div class="sub">Recruitment Drive Swarm — coordinator + specialists + skills</div>
  </div>
  <div class="live"><span class="dot"></span><span id="clock">live</span></div>
</header>
<nav id="nav"></nav>
<main id="view"></main>

<script>
const TABS = [
  ["overview","Overview"],["architecture","Architecture"],["teams","Agent Teams"],["pipeline","Pipeline"],
  ["candidates","Candidates"],["positions","Open Positions"],
  ["panelists","Panelists & Slots"],["interviews","Interviews & Results"],
  ["integration","Integration"],["hub","Project Hub"],["meetings","Meetings"],["optimization","Optimization"]
];
let STATE=null, TAB="overview", SELECTED_TEAM=null, SELECTED_DOC=0, SELECTED_MEETING=0;

function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function pill(s){const c=String(s||"").toLowerCase().replace(/[^a-z]/g,"");return `<span class="pill ${c}">${s}</span>`;}
function chips(a){return (a||[]).map(s=>`<span class="chip">${s}</span>`).join("");}
function money(n){return "$"+(n).toLocaleString(undefined,{maximumFractionDigits:2});}
function kpi(l,v,d){return `<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div>${d?`<div class="d">${d}</div>`:""}</div>`;}

/* ---- tiny markdown renderer ---- */
function md(src){
  const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const lines=src.split("\n"); let out=[],i=0;
  function inline(t){return esc(t)
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');}
  while(i<lines.length){
    let ln=lines[i];
    if(ln.startsWith("```")){let b=[];i++;while(i<lines.length&&!lines[i].startsWith("```")){b.push(esc(lines[i]));i++;}i++;out.push(`<pre><code>${b.join("\n")}</code></pre>`);continue;}
    if(/^#{1,6}\s/.test(ln)){const n=ln.match(/^#+/)[0].length;out.push(`<h${n}>${inline(ln.replace(/^#+\s/,""))}</h${n}>`);i++;continue;}
    if(/^\s*[-*]\s/.test(ln)){let it=[];while(i<lines.length&&/^\s*[-*]\s/.test(lines[i])){it.push(`<li>${inline(lines[i].replace(/^\s*[-*]\s/,""))}</li>`);i++;}out.push(`<ul>${it.join("")}</ul>`);continue;}
    if(/^\s*\d+\.\s/.test(ln)){let it=[];while(i<lines.length&&/^\s*\d+\.\s/.test(lines[i])){it.push(`<li>${inline(lines[i].replace(/^\s*\d+\.\s/,""))}</li>`);i++;}out.push(`<ol>${it.join("")}</ol>`);continue;}
    if(/^\|/.test(ln)){let rows=[];while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i]);i++;}
      const cells=r=>r.split("|").slice(1,-1).map(c=>c.trim());
      let h=cells(rows[0]);let body=rows.slice(2).map(r=>`<tr>${cells(r).map(c=>`<td>${inline(c)}</td>`).join("")}</tr>`).join("");
      out.push(`<table><thead><tr>${h.map(c=>`<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`);continue;}
    if(ln.startsWith(">")){out.push(`<blockquote>${inline(ln.replace(/^>\s?/,""))}</blockquote>`);i++;continue;}
    if(ln.trim()===""){i++;continue;}
    out.push(`<p>${inline(ln)}</p>`);i++;
  }
  return out.join("\n");
}

function renderNav(){const n=document.getElementById("nav");n.innerHTML="";TABS.forEach(([id,l])=>{const b=el("button",id===TAB?"active":"",l);b.onclick=()=>{TAB=id;SELECTED_TEAM=null;render();};n.appendChild(b);});}

/* ---- views ---- */
function viewOverview(){
  const a=STATE.agents,o=STATE.optimization,d=STATE.data,p=d.pipeline_summary;
  const done=a.filter(x=>x.status==="done").length;
  return `<div class="banner">Dummy data until the backend Tracker Agent writes <code>data/progress.json</code> (see Meetings → Dashboard ↔ Backend). Frontend = frontend branch; backend = feature branch.</div>
  <div class="grid kpis">
    ${kpi("Teams",STATE.teams.length,(STATE.teams.filter(t=>t.status==="done").length)+" complete")}
    ${kpi("Open Positions",d.open_positions.filter(x=>x.status==="Open").length,d.open_positions.length+" total")}
    ${kpi("Candidates",d.candidates.length,p.selected+" selected · "+p.rejected+" rejected")}
    ${kpi("Interviews",d.interviews.length,"by Panelist Agent")}
    ${kpi("AI Cost",money(o.ai_cost_usd),"actual tokens")}
    ${kpi("Saved vs Human",money(o.savings_usd),o.roi_x+"× ROI")}
  </div>
  <h2 class="sec">Recruitment Pipeline</h2><div class="card">${flowHtml(p)}</div>
  <h2 class="sec">Agent Teams</h2><div class="grid cards">${STATE.teams.map(teamCard).join("")}</div>`;
}
function flowHtml(p){
  const st=[["Background Check",p.background_check],["JD Match",p.jd_match],["Panel Match",p.panel_match],["Interviewing",p.interviewing],["Selected",p.selected]];
  return `<div class="flow">`+st.map((s,i)=>`<div class="stage"><div class="n">${s[1]}</div><div class="muted">${s[0]}</div></div>${i<st.length-1?'<span class="arrow">→</span>':''}`).join("")+
  `</div><div style="margin-top:12px" class="muted">Rejected: <b style="color:var(--bad)">${p.rejected}</b> — the gated pipeline stops early on a failed background check or fit gate.</div>`;
}
function teamCard(t){
  return `<div class="card team-card" onclick="openTeam('${t.id}')">
    <h3>${t.name}</h3>
    <div class="muted" style="font-size:12px">Lead: ${t.lead}</div>
    <div class="team-meta"><span><span class="led ${t.status}"></span>${pill(t.status)}</span><span>${t.members.length} subagents →</span></div>
  </div>`;
}
function viewTeams(){
  if(SELECTED_TEAM){
    const t=STATE.teams.find(x=>x.id===SELECTED_TEAM);
    return `<button class="back" onclick="closeTeam()">← All teams</button>
    <h2 class="sec">${t.name} — ${t.members.length} subagents</h2>
    <div class="muted" style="margin-bottom:10px">Lead: <b>${t.lead}</b> · ${t.model} · ${pill(t.status)}</div>
    <div class="card">${t.members.map(m=>`<div class="member">
      <span class="led ${m.status}"></span>
      <div><div class="nm">${m.name}</div><div class="muted" style="font-size:12.5px">${m.task}</div></div>
      <div class="tk">${pill(m.status)}<br>${m.model}${m.tokens?" · "+m.tokens.toLocaleString()+" tok":""}</div>
    </div>`).join("")}</div>`;
  }
  return `<div class="banner">Click any team to see its subagents and what each is doing.</div>
  <h2 class="sec">Agent Teams</h2><div class="grid cards">${STATE.teams.map(teamCard).join("")}</div>
  <h2 class="sec">Task Board</h2><div class="card"><table><thead><tr><th>ID</th><th>Task</th><th>Owner</th><th>Status</th></tr></thead><tbody>
  ${STATE.tasks.map(t=>`<tr><td>${t.id}</td><td>${t.title}</td><td>${t.owner}</td><td>${pill(t.status)}</td></tr>`).join("")}</tbody></table></div>`;
}
window.openTeam=id=>{SELECTED_TEAM=id;TAB="teams";render();};
window.closeTeam=()=>{SELECTED_TEAM=null;render();};

function viewPipeline(){const p=STATE.data.pipeline_summary;return `<h2 class="sec">Gated Recruitment Pipeline</h2><div class="card">${flowHtml(p)}</div>
  <h2 class="sec">Candidates by stage</h2><div class="card"><table><thead><tr><th>Candidate</th><th>Stage</th><th>BG Check</th><th>JD Score</th><th>Result</th></tr></thead><tbody>
  ${STATE.data.candidates.map(c=>`<tr><td><b>${c.name}</b></td><td>${pill(c.stage)}</td><td>${pill(c.bg_check)}</td><td>${c.jd_score??"—"}</td><td>${pill(c.result)}</td></tr>`).join("")}</tbody></table></div>`;}
function viewCandidates(){const pn=id=>(STATE.data.open_positions.find(p=>p.id===id)||{}).title||id;
  return `<h2 class="sec">Candidates</h2><div class="card"><table><thead><tr><th>Name</th><th>Applied For</th><th>Location</th><th>Skills</th><th>Stage</th><th>Result</th></tr></thead><tbody>
  ${STATE.data.candidates.map(c=>`<tr><td><b>${c.name}</b></td><td>${pn(c.position)}</td><td>${c.location}</td><td>${chips(c.skills)}</td><td>${pill(c.stage)}</td><td>${pill(c.result)}</td></tr>`).join("")}</tbody></table></div>`;}
function viewPositions(){return `<h2 class="sec">Open Positions</h2><div class="card"><table><thead><tr><th>Title</th><th>Location</th><th>Status</th><th>Openings</th><th>Must-have</th><th>Applicants</th></tr></thead><tbody>
  ${STATE.data.open_positions.map(p=>`<tr><td><b>${p.title}</b></td><td>${p.location}</td><td>${pill(p.status)}</td><td>${p.openings}</td><td>${chips(p.must_have)}</td><td>${p.applicants}</td></tr>`).join("")}</tbody></table></div>`;}
function viewPanelists(){return `<h2 class="sec">Panelists & Available Slots</h2><div class="card"><table><thead><tr><th>Panelist</th><th>Role</th><th>Location</th><th>Skills</th><th>Availability</th></tr></thead><tbody>
  ${STATE.data.panelists.map(p=>`<tr><td><b>${p.name}</b></td><td>${p.title}</td><td>${p.location}</td><td>${chips(p.skills)}</td><td>${p.availability.map(a=>`<div>${a.date}: ${a.slots.join(", ")}</div>`).join("")}</td></tr>`).join("")}</tbody></table></div>`;}
function viewInterviews(){return `<div class="banner">The <b>Panelist Agent</b> ranks panelists by skill overlap, filters by availability, assigns mode (In-Person if locations match else Online), then schedules the interview.</div>
  <h2 class="sec">Interviews & Results</h2><div class="card"><table><thead><tr><th>Candidate</th><th>Position</th><th>Panel</th><th>Mode</th><th>When</th><th>Overlap</th><th>Status</th><th>Result</th></tr></thead><tbody>
  ${STATE.data.interviews.map(i=>`<tr><td><b>${i.candidate}</b></td><td>${i.position}</td><td>${i.panel.join(", ")}</td><td>${pill(i.mode)}</td><td>${i.datetime}</td><td>${i.skill_overlap}</td><td>${pill(i.status)}</td><td>${pill(i.result)}</td></tr>`).join("")}</tbody></table></div>`;}

function viewArchitecture(){
  return `<div class="banner">Two agent swarms in <b>Talent Cortex</b> — the <b>Build Swarm</b> that created the product and the <b>Application Swarm</b> that runs inside it. <a href="/architecture.html" target="_blank">Open full diagram ↗</a></div>
  <iframe src="/architecture.html" title="Talent Cortex swarm diagram" style="width:100%;height:1500px;border:1px solid var(--line);border-radius:14px;background:#0b0f1a"></iframe>`;
}
function viewIntegration(){
  const ig=STATE.integration||{};const comps=ig.components||[];const eps=ig.endpoints||[];const live=STATE.live_agents||[];
  const compCards=comps.map(c=>`<div class="card"><h3 style="margin:0 0 4px">${c.name}</h3><div class="muted" style="font-size:12px">branch: <code>${c.branch}</code></div><div style="margin:8px 0">${pill(c.status)}</div><div class="muted" style="font-size:12.5px">${c.note}</div></div>`).join("");
  const epRows=eps.map(e=>`<tr><td><span class="pill ${e.backend==='done'?'done':'pending'}" style="font-family:monospace">${e.method}</span> <code>${e.path}</code></td><td>${e.consumer}</td><td>${pill(e.frontend)}</td><td>${pill(e.backend)}</td><td>${e.tracked?'✓':'—'}</td></tr>`).join("");
  const liveBlock = live.length
    ? `<div class="card">${live.map(a=>`<div class="member"><span class="led ${a.status}"></span><div><div class="nm">${a.name}</div><div class="muted" style="font-size:12.5px">${a.task||''}</div></div><div class="tk">${pill(a.status)} · ${a.team||''}${a.tokens?' · '+a.tokens.toLocaleString()+' tok':''}</div></div>`).join("")}</div>`
    : `<div class="card muted">No live backend agent activity yet. When the backend runs with the Tracker (<code>tracker.record_agent(...)</code> writing <code>data/agents.json</code>), agents light up here and on Agent Teams.</div>`;
  return `<div class="banner">Tracks the three-way integration: <b>Frontend</b> (frontend branch) ↔ <b>Backend</b> (feature branch) ↔ <b>Dashboard</b> (this branch). ${ig.pipeline_link||''}</div>
  <h2 class="sec">Components</h2><div class="grid cards">${compCards}</div>
  <h2 class="sec">API Contract — Frontend ↔ Backend</h2>
  <div class="card"><table><thead><tr><th>Endpoint</th><th>Consumer</th><th>Frontend</th><th>Backend</th><th>Tracked</th></tr></thead><tbody>${epRows}</tbody></table></div>
  <h2 class="sec">Live Backend Agents</h2>${liveBlock}`;
}
function viewHub(){
  const docs=STATE.docs||[];if(!docs.length)return `<div class="card">No docs found yet.</div>`;
  if(SELECTED_DOC>=docs.length)SELECTED_DOC=0;
  const cats=[...new Set(docs.map(d=>d.category))];
  let list="";cats.forEach(c=>{list+=`<div class="cat">${c}</div>`;docs.forEach((d,idx)=>{if(d.category===c)list+=`<div class="docitem ${idx===SELECTED_DOC?'active':''}" onclick="selDoc(${idx})">${d.title||d.file}</div>`;});});
  const cur=docs[SELECTED_DOC];
  return `<div class="banner">Project Hub — every PRD, design, spec, guide and meeting doc, in one place.</div>
  <div class="hub"><div class="card doclist">${list}</div><div class="card md">${md(cur.content)}</div></div>`;
}
window.selDoc=i=>{SELECTED_DOC=i;render();};

function viewMeetings(){
  const m=STATE.meetings||[];if(!m.length)return `<div class="card">No meetings recorded yet (docs/meetings/).</div>`;
  if(SELECTED_MEETING>=m.length)SELECTED_MEETING=0;
  let list=m.map((x,i)=>`<div class="docitem ${i===SELECTED_MEETING?'active':''}" onclick="selMeet(${i})">${x.title}</div>`).join("");
  return `<div class="banner">Cross-team meeting records — auto-loaded from <code>docs/meetings/</code>.</div>
  <div class="hub"><div class="card doclist">${list}</div><div class="card md">${md(m[SELECTED_MEETING].content)}</div></div>`;
}
window.selMeet=i=>{SELECTED_MEETING=i;render();};

function viewOptimization(){
  const o=STATE.optimization;
  const rows=STATE.agents.filter(a=>a.tokens>0).map(a=>`<tr><td>${a.name}</td><td>${a.model}</td><td>${a.tokens.toLocaleString()}</td><td>${money(a.cost_usd)}</td></tr>`).join("");
  return `<div class="grid kpis">
    ${kpi("Total Tokens",o.total_tokens.toLocaleString(),"actual usage")}
    ${kpi("AI Cost",money(o.ai_cost_usd),"blended est.")}
    ${kpi("Human Baseline",money(o.human_cost_usd),o.human_hours+" hrs @ "+money(o.rate))}
    ${kpi("Savings",money(o.savings_usd),o.roi_x+"× ROI")}
  </div>
  <h2 class="sec">Cost by agent (recorded so far)</h2><div class="card"><table><thead><tr><th>Agent</th><th>Model</th><th>Tokens</th><th>Cost</th></tr></thead><tbody>${rows||'<tr><td colspan=4 class=muted>No token usage recorded yet.</td></tr>'}</tbody></table></div>
  <h2 class="sec">How these numbers are computed</h2><div class="card"><div class="formula">${o.formula}</div></div>`;
}

const VIEWS={overview:viewOverview,architecture:viewArchitecture,teams:viewTeams,pipeline:viewPipeline,candidates:viewCandidates,positions:viewPositions,panelists:viewPanelists,interviews:viewInterviews,integration:viewIntegration,hub:viewHub,meetings:viewMeetings,optimization:viewOptimization};
function render(){renderNav();document.getElementById("view").innerHTML=STATE?VIEWS[TAB]():'<div class="card">Loading…</div>';}

let LAST="";
async function load(){
  try{
    const r=await fetch("/api/state");
    const txt=await r.text();
    document.getElementById("clock").textContent="updated "+new Date().toLocaleTimeString();
    if(txt===LAST) return;            // nothing changed -> skip re-render (no flicker)
    LAST=txt; STATE=JSON.parse(txt); render();
  }catch(e){document.getElementById("view").innerHTML='<div class="card">Could not reach server. Run: <code>python dashboard/serve.py</code></div>';}
}
load();setInterval(load,3000);
</script>
</body>
</html>
